[package]
name = "snapshot-to-s3"
version = "0.1.0"
edition = "2021"
authors = ["SilverBut"]
license = "AGPL-3.0"
description = "Stream encrypted ZFS snapshot backups to S3-compatible object storage"
repository = "https://github.com/SilverBut/snapshot-to-s3"
readme = "README.md"
keywords = ["zfs", "snapshot", "s3", "encryption", "backup"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
aes-gcm = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
bytes = "1"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
hex = "0.4"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
quick-xml = { version = "0.41", features = ["serialize"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io", "rt"] }

[features]
# Exposes the in-memory fakes in `snapshot_to_s3::testing` to the integration
# tests (enabled for them by the dev-dependency below; never for releases).
test-support = []

[dev-dependencies]
snapshot-to-s3 = { path = ".", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = true
codegen-units = 1
