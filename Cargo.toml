[package]
name = "snapshot-to-s3"
version = "0.1.0"
edition = "2021"
authors = ["SilverBut"]
license = "AGPL-3.0"
description = "Encrypt snapshot and upload to S3-compatible object storage"
repository = "https://github.com/SilverBut/snapshot-to-s3"
readme = "README.md"
keywords = ["snapshot", "s3", "encryption", "backup"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
aws-sdk-s3 = "1"
aws-config = "1"
aes-gcm = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
bytes = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
