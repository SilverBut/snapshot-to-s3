[package]
name = "snapshot-to-s3"
version = "0.1.0"
edition = "2021"
authors = ["SilverBut"]
license = "AGPL-3.0"
description = "Encrypt snapshot and upload to S3-compatible object storage"
repository = "https://github.com/SilverBut/snapshot-to-s3"
readme = "README.md"
keywords = ["snapshot", "s3", "encryption", "backup"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
aes-gcm = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
bytes = "1"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
hex = "0.4"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
quick-xml = { version = "0.41", features = ["serialize"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io", "rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
