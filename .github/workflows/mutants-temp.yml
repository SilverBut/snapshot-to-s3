# TEMPORARY: mutation-testing baseline for the test-refactor PR. Remove before merge.
# rev: 1
name: Mutants (temporary)

on:
  push:
    branches: [quality/test-tooling-restructure]
    paths: [.github/workflows/mutants-temp.yml]

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-mutants
      - run: |
          cargo mutants --no-shuffle -j2 --timeout-multiplier 3 \
            --shard ${{ matrix.shard }}/8 \
            -f 'src/s3/**' -f 'src/store/**' -f 'src/zfs/**' -f src/crypto/stream.rs \
            -f 'src/backup/**' -f 'src/restore/**' || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-${{ github.sha }}-${{ matrix.shard }}
          path: |
            mutants.out/*.txt
            mutants.out/outcomes.json
