name: Copilot Setup Steps

on:
  workflow_dispatch:
    inputs:
      verify_e2e:
        description: Verify full recovery after setup, retaining the pool for agent handoff
        type: boolean
        default: false
  workflow_call:
    inputs:
      verify_e2e:
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - tests/provision/copilot_setup.sh
      - tests/provision/lib/hosted.sh

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: rust-${{ runner.os }}-${{ runner.arch }}-copilot-${{ hashFiles('Cargo.lock') }}
      - name: Install ZFS and development dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            zfsutils-linux gnupg python3-venv shellcheck musl-tools binutils
          sudo modprobe zfs
          cargo fetch --locked
      - name: Prepare the retained development pool and pinned test tools
        shell: bash
        run: bash tests/provision/copilot_setup.sh
      - name: Verify handoff using only the already prepared pool
        if: inputs.verify_e2e
        shell: bash
        run: bash tests/provision/copilot_setup.sh --verify
