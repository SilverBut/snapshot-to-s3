name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --locked

  quality:
    name: Formatting and lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-lint-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Validate CI scripts and failure gate
        run: |
          shellcheck tests/support/ci_e2e.sh tests/support/local_s3.sh tests/support/zfs_s3_e2e.sh
          python3 -m unittest discover -s tests/support -p 'test_ci_*.py' -v

  release:
    name: Release build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --locked

  audit:
    name: Dependency audit
    uses: ./.github/workflows/security.yml

  e2e:
    name: ZFS and S3 end-to-end
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-e2e-${{ hashFiles('Cargo.lock') }}
      - name: Install hosted ZFS and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zfsutils-linux python3-venv gnupg
          sudo modprobe zfs
      - name: Prepare disposable pool and run every infrastructure-backed test
        run: bash tests/support/ci_e2e.sh
      - name: Upload diagnostics without keys or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sts-${{ github.run_id }}-${{ github.run_attempt }}/logs/
            ${{ runner.temp }}/sts-${{ github.run_id }}-${{ github.run_attempt }}/s3/logs/
            ${{ runner.temp }}/sts-${{ github.run_id }}-${{ github.run_attempt }}/s3/disk-budget-*.txt
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: CI Gate
    if: always()
    needs: [test, quality, release, audit, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tests/support/ci_gate.py
