name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --locked

  quality:
    name: Formatting and lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-lint-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Validate CI scripts and failure gate
        run: |
          shellcheck tests/provision/ci_e2e.sh tests/e2e/local_s3.sh tests/e2e/run.sh tests/provision/lib/hosted.sh tests/provision/copilot_setup.sh
          python3 -m unittest discover -s tests/tooling -p 'test_*.py' -v
          python3 -m scripts.release.prepare check

  release:
    name: Release build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --locked

  audit:
    name: Dependency audit
    uses: ./.github/workflows/security.yml

  copilot:
    name: Cloud agent environment handoff
    uses: ./.github/workflows/copilot-setup-steps.yml
    with:
      verify_e2e: true

  e2e:
    name: ZFS and S3 end-to-end
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-e2e-${{ hashFiles('Cargo.lock') }}
      - name: Install hosted ZFS and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zfsutils-linux python3-venv gnupg
          sudo modprobe zfs
      - name: Prepare disposable pool and run every infrastructure-backed test
        run: bash tests/provision/ci_e2e.sh
      - name: Upload diagnostics without keys or credentials
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sts-${{ github.run_id }}-${{ github.run_attempt }}/logs/
            ${{ runner.temp }}/sts-${{ github.run_id }}-${{ github.run_attempt }}/s3/logs/
            ${{ runner.temp }}/sts-${{ github.run_id }}-${{ github.run_attempt }}/s3/disk-budget-*.txt
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: CI Gate
    if: always()
    needs: [test, quality, release, audit, e2e, copilot]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -m scripts.ci.gate
