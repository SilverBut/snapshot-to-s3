name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  e2e:
    name: OpenZFS + SeaweedFS end-to-end
    # Fork PR code must never execute on a persistent privileged runner. Do not
    # switch this to pull_request_target or remove the same-repository gate.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # Administrators provision this dedicated runner and its existing ONLINE
    # user:isdev=yes pool out of band. CI never provisions or labels pools.
    # Restrict its runner group to this repository and trusted contributors;
    # run only one runner process per dedicated pool. Use a short runner work
    # root (for example /w) so GnuPG UNIX socket paths fit below 108 bytes.
    # Fork PRs use hosted jobs.
    runs-on: [self-hosted, Linux, X64, zfs-e2e]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: e/${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # A failed harness may retain mounted diagnostic data. Never clean a
          # previous checkout automatically or reuse another run's workspace.
          path: e/${{ github.run_id }}-${{ github.run_attempt }}
          clean: false
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run real storage and official Tink interoperability tests
        run: bash tests/support/ci_e2e.sh

      - name: Upload end-to-end diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e/${{ github.run_id }}-${{ github.run_attempt }}/.ci-e2e/logs/
            e/${{ github.run_id }}-${{ github.run_attempt }}/.ci-e2e/s3/logs/
            e/${{ github.run_id }}-${{ github.run_attempt }}/.ci-e2e/s3/disk-budget-*.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Run tests
        run: cargo test --locked --verbose

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --locked
