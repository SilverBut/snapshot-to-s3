name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version change (initial before the first stable release)
        type: choice
        required: true
        options: [initial, patch, minor, major]
      channel:
        description: Release channel
        type: choice
        default: stable
        options: [stable, alpha, beta, pre, rc]
      dry_run:
        description: Preview only, without changing branches or creating a PR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Calculate version and prepare reviewed release notes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Prepare release proposal or show preview
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(prepare --bump "$BUMP" --channel "$CHANNEL")
          if [[ "$DRY_RUN" == true ]]; then
            args+=(--dry-run)
          fi
          python3 -m scripts.release.prepare "${args[@]}"
